[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvrecast"
version = "0.1.0"
description = "Reproducibility scaffold for the DiHiggs LLP DV+jets recast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
# Frozen third-party submodule; project lint ownership excludes upstream code.
extend-exclude = ["external/recastingCodes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
